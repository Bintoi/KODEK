<style>
/* Design tokens */
:root {
  /* Layout: Edge-to-edge bands with constrained content, asymmetric product grid */

  /* Color: Charcoal base with warm terracotta accent, cream highlights */
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --ink-primary: #1C1917;
  --ink-secondary: #57534E;
  --ink-muted: #78716C;
  --accent: #D97742;
  --accent-hover: #C2652F;
  --accent-soft: #FDF4ED;
  --border: #E7E5E4;
  --badge-bg: #F5F5F4;

  /* Type */
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Inter', -apple-system, system-ui, sans-serif;

  /* Spacing */
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-right: max(16px, env(safe-area-inset-right, 0px));
  --max-width: 1280px;
  --section-gap: clamp(48px, 8vw, 96px);
}

    --ink-secondary: #D6D3D1;
    --ink-muted: #A8A29E;
    --accent: #EA8D5B;
    --accent-hover: #F5A877;
    --accent-soft: #3C2A20;
    --border: #44403C;

    color-scheme: dark;
  }
}

body {

.cart-item-actions {

.qty-btn {

<script>
const { useState, useEffect } = React;
const { motion, AnimatePresence } = Motion;

// Sample product data
const products = [
  {
    id: 1,
    title: "Classic Linen Shirt",
    category: "Men's Shirts",
    price: 89,
    originalPrice: null,
    badge: null
  },
  {

  },

  },
  {
    id: 4,

    badge: "New"
  },
  {
    id: 5,
    title: "Cashmere Sweater",
    category: "Knitwear",

    badge: null
  },
  {
    id: 6,

    category: "Outerwear",

  },
  {
    id: 7,

    category: "Accessories",
    price: 69,

    badge: null
  },
  {
    id: 8,
    title: "Cotton Dress",
    category: "Women's Dresses",
    price: 149,
    originalPrice: null,
    badge: "New"
  }
];

const categories = [
  { title: "Men's Collection", label: "Men's" },
  { title: "Women's Collection", label: "Women's" },
  { title: "Accessories", label: "Accessories" }
];

const features = [
  {
    icon: "🚚",
    title: "Free Shipping",
    description: "On all orders over $100. Fast and reliable delivery to your door."
  },
  {
    icon: "♻️",
    title: "Sustainable",
    description: "Ethically sourced materials and eco-friendly production practices."
  },
  {
    icon: "↩️",
    title: "Easy Returns",
    description: "30-day return policy. Not satisfied? Send it back hassle-free."
  },
  {
    icon: "⭐",
    title: "Premium Quality",
    description: "Handpicked fabrics and meticulous craftsmanship in every piece."
  }
];

function App() {
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);

  useEffect(() => {
    try {
      const savedCart = localStorage.getItem('kodek-cart');
      if (savedCart) {
        setCart(JSON.parse(savedCart));
      }
    } catch (e) {
      console.log('Could not load cart from storage');
    }
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem('kodek-cart', JSON.stringify(cart));
    } catch (e) {
      console.log('Could not save cart to storage');
    }
  }, [cart]);

  const addToCart = (productId) => {
    const product = products.find(p => p.id === productId);
    if (!product) return;

    setCart(prevCart => {
      const existingItem = prevCart.find(item => item.id === productId);
      if (existingItem) {
        return prevCart.map(item =>
          item.id === productId ? { ...item, quantity: item.quantity + 1 } : item
        );
      } else {
        return [...prevCart, { ...product, quantity: 1 }];
      }
    });

    setCartOpen(true);
  };

  const updateQuantity = (productId, delta) => {
    setCart(prevCart => {
      return prevCart.map(item => {
        if (item.id === productId) {
          const newQuantity = item.quantity + delta;
          return newQuantity <= 0 ? null : { ...item, quantity: newQuantity };
        }
        return item;
      }).filter(Boolean);
    });
  };

  const removeFromCart = (productId) => {
    setCart(prevCart => prevCart.filter(item => item.id !== productId));
  };

  const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
  const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

  const handleCheckout = () => {
    if (cart.length === 0) {
      alert('Your cart is empty');
      return;
    }
    alert(`Checkout functionality would be integrated with a payment processor like Stripe, PayPal, or Square. Total: $${totalPrice.toFixed(2)}`);
  };

  const handleNewsletter = (e) => {
    e.preventDefault();
    const email = e.target.querySelector('input').value;
    alert(`Thank you for subscribing! We'll send updates to ${email}`);
    e.target.reset();
  };

  const scrollToSection = (e, href) => {
    if (href === '#' || href === '') return;

    e.preventDefault();
    const target = document.querySelector(href);
    if (target) {
      const headerOffset = 80;
      const elementPosition = target.getBoundingClientRect().top;
      const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

      window.scrollTo({
        top: offsetPosition,
        behavior: 'smooth'
      });

      setCartOpen(false);
    }
  };

  return React.createElement(React.Fragment, null,
    // Header
    React.createElement(motion.header, {
      initial: { y: -100 },
      animate: { y: 0 },
      transition: { duration: 0.6, ease: "easeOut" }
    },
      React.createElement('div', { className: 'wrapper header-content' },
        React.createElement('a', { href: '#', className: 'logo' }, 'KODEK'),
